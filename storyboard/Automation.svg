<svg xmlns="http://www.w3.org/2000/svg" width="9864" height="970" viewBox="0 0 9864 970">
<rect width="100%" height="100%" fill="#1c1c1c"/>
<g id="Automation">
<rect x="40" y="80" width="230" height="36" fill="#10b98a"/>
<text x="155" y="105" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Automation</text>
<g id="Automation-scene-1">
<rect x="310" y="80" width="960" height="32" fill="#14223b"/>
<text x="790" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">1</text>
<text x="310" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Automated Business Manager</text>
<rect x="310" y="180" width="960" height="540" fill="#000000"/>
<rect x="310" y="770" width="960" height="126" fill="#000000"/>
<text x="790" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Taskmaverick automatically guides teams to take</text>
<text x="790" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">initiatives on their own</text>
</g>
<g id="Automation-scene-2">
<rect x="1366" y="80" width="960" height="32" fill="#14223b"/>
<text x="1846" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">2</text>
<text x="1366" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Automated Business Manager</text>
<rect x="1366" y="180" width="960" height="540" fill="#000000"/>
<rect x="1366" y="770" width="960" height="126" fill="#000000"/>
<text x="1846" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">There is no need for a human manager to constantly remind</text>
<text x="1846" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">people</text>
</g>
<g id="Automation-scene-3">
<rect x="2422" y="80" width="960" height="32" fill="#14223b"/>
<text x="2902" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">3</text>
<text x="2422" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Automated Business Manager</text>
<rect x="2422" y="180" width="960" height="540" fill="#000000"/>
<rect x="2422" y="770" width="960" height="126" fill="#000000"/>
<text x="2902" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Work Missions can be automatically assigned to people on</text>
<text x="2902" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">their Personal Boards…</text>
</g>
<g id="Automation-scene-4">
<rect x="3478" y="80" width="960" height="32" fill="#14223b"/>
<text x="3958" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">4</text>
<text x="3478" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Automated Business Manager</text>
<rect x="3478" y="180" width="960" height="540" fill="#000000"/>
<rect x="3478" y="770" width="960" height="126" fill="#000000"/>
<text x="3958" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">….or they can be posted on Team Boards to facilitate</text>
<text x="3958" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">cooperation</text>
</g>
<g id="Automation-scene-5">
<rect x="4534" y="80" width="960" height="32" fill="#14223b"/>
<text x="5014" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">5</text>
<text x="4534" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Device Sharing</text>
<rect x="4534" y="180" width="960" height="540" fill="#000000"/>
<rect x="4534" y="770" width="960" height="126" fill="#000000"/>
<text x="5014" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Multiple people can share a single device to save on</text>
<text x="5014" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">hardware costs</text>
</g>
<g id="Automation-scene-6">
<rect x="5590" y="80" width="960" height="32" fill="#14223b"/>
<text x="6070" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">6</text>
<text x="5590" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Device Sharing</text>
<rect x="5590" y="180" width="960" height="540" fill="#000000"/>
<rect x="5590" y="770" width="960" height="126" fill="#000000"/>
<text x="6070" y="843" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Each person enters their personal code to Claim a Mission</text>
</g>
<g id="Automation-scene-7">
<rect x="6646" y="80" width="960" height="32" fill="#14223b"/>
<text x="7126" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">7</text>
<text x="6646" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Device Sharing</text>
<rect x="6646" y="180" width="960" height="540" fill="#000000"/>
<rect x="6646" y="770" width="960" height="126" fill="#000000"/>
<text x="7126" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">After performing the work, they enter their code again to</text>
<text x="7126" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Close the Mission</text>
</g>
<g id="Automation-scene-8">
<rect x="7702" y="80" width="960" height="32" fill="#14223b"/>
<text x="8182" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">8</text>
<text x="7702" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Device Sharing</text>
<rect x="7702" y="180" width="960" height="540" fill="#000000"/>
<rect x="7702" y="770" width="960" height="126" fill="#000000"/>
<text x="8182" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">When clearly displayed, a shared device can effectively</text>
<text x="8182" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">engage a whole team</text>
</g>
<g id="Automation-scene-9">
<rect x="8758" y="80" width="960" height="32" fill="#14223b"/>
<text x="9238" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">9</text>
<text x="8758" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Device Sharing</text>
<rect x="8758" y="180" width="960" height="540" fill="#000000"/>
<rect x="8758" y="770" width="960" height="126" fill="#000000"/>
<text x="9238" y="843" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">No important task is ever forgotten or delayed</text>
</g>
</g>
</svg>