<rect x="10870" y="770" width="960" height="126" fill="#000000"/>
<text x="11350" y="843" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Clever Gamification can also be used to boost efficiency</text>
</g>
<g id="Efficiency-scene-12">
<rect x="11926" y="80" width="960" height="32" fill="#14223b"/>
