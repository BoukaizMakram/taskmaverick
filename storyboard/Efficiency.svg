<text x="12982" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Gamification</text>
<rect x="12982" y="180" width="960" height="540" fill="#000000"/>
<rect x="12982" y="770" width="960" height="126" fill="#000000"/>
<text x="13462" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Undesirable Missions can offer higher points to increase</text>
<text x="13462" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">motivation</text>
</g>
<g id="Efficiency-scene-14">
