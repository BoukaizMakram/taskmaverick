<text x="15094" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Recognition</text>
<rect x="15094" y="180" width="960" height="540" fill="#000000"/>
<rect x="15094" y="770" width="960" height="126" fill="#000000"/>
<text x="15574" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">That is why each performer’s name is clearly stamped on</text>
<text x="15574" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">their Missions</text>
</g>
<g id="Efficiency-scene-16">
<rect x="16150" y="80" width="960" height="32" fill="#14223b"/>
<text x="16630" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">16</text>
<text x="16150" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Recognition</text>
<rect x="16150" y="180" width="960" height="540" fill="#000000"/>
<rect x="16150" y="770" width="960" height="126" fill="#000000"/>
<text x="16630" y="843" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Their execution duration is also tracked per Mission</text>
</g>
<g id="Efficiency-scene-17">
<rect x="17206" y="80" width="960" height="32" fill="#14223b"/>
<text x="17686" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">17</text>
<text x="17206" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Recognition</text>
<rect x="17206" y="180" width="960" height="540" fill="#000000"/>
<rect x="17206" y="770" width="960" height="126" fill="#000000"/>
<text x="17686" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">A clear record is maintained per mission, per person and</text>
<text x="17686" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">per team</text>
</g>
<g id="Efficiency-scene-18">
<rect x="18262" y="80" width="960" height="32" fill="#14223b"/>
<text x="18742" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">18</text>
<text x="18262" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Recognition</text>
<rect x="18262" y="180" width="960" height="540" fill="#000000"/>
<rect x="18262" y="770" width="960" height="126" fill="#000000"/>
<text x="18742" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Taskmaverick increases efficiency by engaging,</text>
<text x="18742" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">motivating, and rewarding teams</text>
