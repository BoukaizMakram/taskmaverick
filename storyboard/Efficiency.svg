<svg xmlns="http://www.w3.org/2000/svg" width="19368" height="970" viewBox="0 0 19368 970">
<rect width="100%" height="100%" fill="#1c1c1c"/>
<g id="Efficiency">
<rect x="40" y="80" width="230" height="36" fill="#10b98a"/>
<text x="155" y="105" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Efficiency</text>
<g id="Efficiency-scene-1">
<rect x="310" y="80" width="960" height="32" fill="#14223b"/>
<text x="790" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">1</text>
<text x="310" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Engagement</text>
<rect x="310" y="180" width="960" height="540" fill="#000000"/>
<rect x="310" y="770" width="960" height="126" fill="#000000"/>
<text x="790" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Taskmaverick increases efficiency by keeping everyone</text>
<text x="790" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">engaged and informed</text>
</g>
<g id="Efficiency-scene-2">
<rect x="1366" y="80" width="960" height="32" fill="#14223b"/>
<text x="1846" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">2</text>
<text x="1366" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Engagement</text>
<rect x="1366" y="180" width="960" height="540" fill="#000000"/>
<rect x="1366" y="770" width="960" height="126" fill="#000000"/>
<text x="1846" y="843" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Everyone can see what Missions were completed…</text>
</g>
<g id="Efficiency-scene-3">
<rect x="2422" y="80" width="960" height="32" fill="#14223b"/>
<text x="2902" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">3</text>
<text x="2422" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Engagement</text>
<rect x="2422" y="180" width="960" height="540" fill="#000000"/>
<rect x="2422" y="770" width="960" height="126" fill="#000000"/>
<text x="2902" y="843" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">…what Missions are being performed…</text>
</g>
<g id="Efficiency-scene-4">
<rect x="3478" y="80" width="960" height="32" fill="#14223b"/>
<text x="3958" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">4</text>
