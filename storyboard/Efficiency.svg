<text x="10294" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">10</text>
<text x="9814" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Urgency</text>
<rect x="9814" y="180" width="960" height="540" fill="#000000"/>
<rect x="9814" y="770" width="960" height="126" fill="#000000"/>
<text x="10294" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">This allows important work to become automatically</text>
