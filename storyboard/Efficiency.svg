<rect x="3478" y="770" width="960" height="126" fill="#000000"/>
<text x="3958" y="843" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">…and what Missions remain due…</text>
</g>
<g id="Efficiency-scene-5">
<rect x="4534" y="80" width="960" height="32" fill="#14223b"/>
<text x="5014" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">5</text>
<text x="4534" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Engagement</text>
<rect x="4534" y="180" width="960" height="540" fill="#000000"/>
<rect x="4534" y="770" width="960" height="126" fill="#000000"/>
<text x="5014" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">No time is wasted on duplicating work that was performed</text>
<text x="5014" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">by someone else…</text>
</g>
<g id="Efficiency-scene-6">
<rect x="5590" y="80" width="960" height="32" fill="#14223b"/>
<text x="6070" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">6</text>
<text x="5590" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Engagement</text>
<rect x="5590" y="180" width="960" height="540" fill="#000000"/>
<rect x="5590" y="770" width="960" height="126" fill="#000000"/>
<text x="6070" y="843" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">…and no time is wasted wondering what to do next</text>
</g>
<g id="Efficiency-scene-7">
