<text x="14518" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">14</text>
<text x="14038" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Recognition</text>
<rect x="14038" y="180" width="960" height="540" fill="#000000"/>
<rect x="14038" y="770" width="960" height="126" fill="#000000"/>
<text x="14518" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Performance improves when individual contributions can be</text>
<text x="14518" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">recognized and rewarded</text>
</g>
<g id="Efficiency-scene-15">
<rect x="15094" y="80" width="960" height="32" fill="#14223b"/>
