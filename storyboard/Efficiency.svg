<text x="11926" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Gamification</text>
<rect x="11926" y="180" width="960" height="540" fill="#000000"/>
<rect x="11926" y="770" width="960" height="126" fill="#000000"/>
<text x="12406" y="843" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Taskmaverick allows reward points to be added to Missions</text>
</g>
