<rect x="8758" y="770" width="960" height="126" fill="#000000"/>
<text x="9238" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">A critical Mission can escalate quicker than a regular</text>
<text x="9238" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Mission…</text>
</g>
<g id="Efficiency-scene-10">
