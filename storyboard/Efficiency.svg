<rect x="6646" y="770" width="960" height="126" fill="#000000"/>
<text x="7126" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Mission timers increase efficiency by creating a sense of</text>
<text x="7126" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">urgency</text>
</g>
<g id="Efficiency-scene-8">
<rect x="7702" y="80" width="960" height="32" fill="#14223b"/>
<text x="8182" y="103" fill="white" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">8</text>
<text x="7702" y="157" fill="#888888" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Urgency</text>
<rect x="7702" y="180" width="960" height="540" fill="#000000"/>
<rect x="7702" y="770" width="960" height="126" fill="#000000"/>
<text x="8182" y="825" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">They change in color as they age…from Green…to Orange…to</text>
<text x="8182" y="861" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Red</text>
</g>
<g id="Efficiency-scene-9">
<rect x="8758" y="80" width="960" height="32" fill="#14223b"/>
